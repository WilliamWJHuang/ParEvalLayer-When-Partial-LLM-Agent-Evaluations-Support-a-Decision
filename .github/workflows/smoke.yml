name: smoke

on:
  push:
  pull_request:

jobs:
  synthetic-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-core.txt
      - run: python reproduce.py --check
      - run: python compare.py --input examples/paired_results.csv --tested candidate --comparison baseline --threshold 0.05
      - run: python reproduce.py --verify
