<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">ParEvalLayer: Compare agents using task scores</title>
<desc id="desc">Put two scores per task in a CSV, choose all rows or the first part, and read the report. Uses results you have already collected.</desc>
<rect width="1280" height="640" fill="#F7F8F4"/>
<text x="64" y="57.94" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#177F73">OPEN-SOURCE AGENT COMPARISON</text>
<text x="60" y="153.04" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="600" fill="#15353C">ParEvalLayer</text>
<text x="64" y="215.24" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#4B6266">Compare agents using task scores</text>
<rect x="64" y="288" width="352" height="188" rx="16" fill="#FFFFFF" stroke="#D5E0DD"/>
<text x="88" y="323.94" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#177F73">01  PREPARE</text>
<text x="88" y="373.78" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#15353C">Two scores per task</text>
<text x="88" y="418.22" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6266">Use scores you already have</text>
<text x="88" y="449.22" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6266">Save them in a CSV file</text>
<rect x="464" y="288" width="352" height="188" rx="16" fill="#FFFFFF" stroke="#D5E0DD"/>
<text x="488" y="323.94" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#177F73">02  COMPARE</text>
<text x="488" y="373.78" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#15353C">Choose the task count</text>
<text x="488" y="418.22" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6266">Use all rows or the first part</text>
<text x="488" y="449.22" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6266">Keep your original row order</text>
<rect x="864" y="288" width="352" height="188" rx="16" fill="#FFFFFF" stroke="#D5E0DD"/>
<text x="888" y="323.94" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#177F73">03  READ</text>
<text x="888" y="373.78" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#15353C">Open the report</text>
<text x="888" y="418.22" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6266">promote / reject / abstain</text>
<text x="888" y="449.22" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6266">See the result and the reason</text>
<path d="M432 382 h17 m-7 -7 l7 7 -7 7" fill="none" stroke="#177F73" stroke-width="3"/>
<path d="M832 382 h17 m-7 -7 l7 7 -7 7" fill="none" stroke="#177F73" stroke-width="3"/>
<text x="64" y="538.68" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#15353C">Use results you have already collected.</text>
<text x="64" y="587.58" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4B6266">CSV input  /  Python  /  MIT-licensed code</text>
</svg>
